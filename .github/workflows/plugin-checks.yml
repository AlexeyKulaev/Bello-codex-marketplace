name: Plugin Checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  plugin-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read pinned Bello source
        id: source
        shell: bash
        run: python scripts/check_plugin_sync.py --print-source >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Makson179/Bello
          ref: ${{ steps.source.outputs.commit }}
          path: .upstream-bello

      - name: Verify exact plugin and test sync
        run: python scripts/check_plugin_sync.py --source .upstream-bello

      - name: Install test dependencies without optional models
        run: python -m pip install ./.upstream-bello pytest

      - name: Test marketplace, advisor and launcher
        run: python -m pytest -q tests

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'

      - name: Validate Claude plugin and marketplace
        if: runner.os == 'Linux'
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.207
          claude plugin validate --strict plugins/bello
          claude plugin validate --strict .claude-plugin/marketplace.json
